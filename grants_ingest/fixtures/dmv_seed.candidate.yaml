#   - Open Society Foundations → Open Music Society Foundation (CA) — wrong
#   - The Share Fund → Share The Cities Action Fund (WA) — wrong
#   - Venable Foundation → Richard & Evelyn Venable Foundation (SC) — wrong
#   - Z. Smith Reynolds → correct org but NC (peripheral to DMV per spec)
#   - Schuster Family Foundation → CO org, not DMV
#   - Surdna Foundation → NY national foundation (may still fund DMV programs)

