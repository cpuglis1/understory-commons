{% extends "base.html" %}
{% block title %}Programs — Understory Commons{% endblock %}
{% block content %}
<h1>Programs</h1>
{% for program in programs %}
  <p><a href="{% url 'attendance:program_detail' program.slug %}">{{ program.name }}</a>
  {% if program.site_label %} — {{ program.site_label }}{% endif %}</p>
{% empty %}
  <p>No programs found.</p>
{% endfor %}
{% endblock %}
